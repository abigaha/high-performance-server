services:
  high-performance-server:
    build: .
    container_name: hps-server
    ports:
      - "9090:9090"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./build/certs:/app/build/certs:ro
      - ./data:/app/data
    environment:
      - DB_HOST=mysql
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: hps-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: music_server
      MYSQL_USER: hps
      MYSQL_PASSWORD: hpspass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
