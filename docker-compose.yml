services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: music_server
      MYSQL_USER: "${MYSQL_USER:-hps}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -u root --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  high-performance-server:
    image: hps-server:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "9090"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: "${MYSQL_USER:-hps}"
      DB_PASSWORD: "${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}"
      DB_NAME: music_server
      AUTH_SECRET: "${AUTH_SECRET:?请在 .env 中配置 AUTH_SECRET}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
    volumes:
      - app_data:/app/data
    expose:
      - "9090"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:latest
    pull_policy: never
    ports:
      - "127.0.0.1:${HPS_HTTP_PORT:-18080}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      high-performance-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  mysql_data:
  app_data:
